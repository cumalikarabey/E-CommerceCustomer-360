[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer360"
version = "0.1.0"
description = "Customer 360 feature engineering pipeline for e-commerce analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
ui = [
  "streamlit>=1.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
